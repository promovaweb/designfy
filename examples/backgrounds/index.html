  <style>
    :root {
      color-scheme: light;
      --background: oklch(0.985 0.004 255);
      --foreground: oklch(0.19 0.025 255);
      --card: oklch(1 0 0);
      --muted: oklch(0.86 0.02 255);
      --muted-foreground: oklch(0.45 0.025 255);
      --border: oklch(0.73 0.024 255);
      --primary: oklch(0.56 0.20 264);
      --primary-foreground: oklch(0.99 0.01 255);
      --secondary: oklch(0.91 0.035 250);
      --accent: oklch(0.69 0.18 374);
      --ring: oklch(0.55 0.2 264);
      --destructive: oklch(0.54 0.22 25);
      --chart-1: oklch(0.55 0.2 264);
      --chart-2: oklch(0.60 0.15 185);
      --chart-3: oklch(0.70 0.16 58);
      --chart-4: oklch(0.55 0.17 320);
      --chart-5: oklch(0.68 0.18 140);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: oklch(0.23 0.026 255);
      --foreground: oklch(0.96 0.01 255);
      --card: oklch(0.27 0.028 255);
      --muted: oklch(0.41 0.04 255);
      --muted-foreground: oklch(0.77 0.028 255);
      --border: oklch(0.58 0.05 255);
      --primary: oklch(0.72 0.17 264);
      --primary-foreground: oklch(0.15 0.03 255);
      --secondary: oklch(0.36 0.045 250);
      --accent: oklch(0.77 0.17 374);
      --ring: oklch(0.74 0.15 264);
      --destructive: oklch(0.70 0.20 25);
      --chart-1: oklch(0.72 0.17 264);
      --chart-2: oklch(0.77 0.16 185);
      --chart-3: oklch(0.80 0.15 58);
      --chart-4: oklch(0.74 0.16 320);
      --chart-5: oklch(0.80 0.18 140);
    }
    * { box-sizing: border-box; }
    body {
      max-width: 1440px;
      margin: auto;
      padding: clamp(1rem, 4vw, 3rem);
      background: var(--background);
      color: var(--foreground);
      font: 1rem/1.45 system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 5vw, 3.25rem); line-height: 1.05; letter-spacing: -.045em; }
    h2 { margin: 0 0 1rem; font-size: 1.5rem; }
    section { margin-block: 2rem; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem; }
    label { display: grid; gap: .25rem; font-size: .875rem; }
    .equivalent-toggle { display: flex; align-items: center; gap: .45rem; cursor: pointer; }
    input { margin: 0; accent-color: var(--primary); }
    button {
      padding: .55rem .8rem;
      border: 1px solid var(--border);
      border-radius: .5rem;
      background: var(--card);
      color: var(--foreground);
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: .875rem; }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: .625rem;
      background: var(--card);
    }
    .preview {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: 10rem;
      background: var(--background);
    }
    figcaption { padding: .625rem .75rem; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
    figcaption strong, code { display: block; }
    figcaption strong { font-size: .875rem; }
    code { margin-top: .125rem; color: var(--muted-foreground); font-size: .72rem; }
    .equivalent-names { margin: .4rem 0 0; color: var(--muted-foreground); font-size: .78rem; }
  </style>
</head>
<body>
  <header>
    <h1>Fundos do Designfy</h1>
    <div class="controls">
      <label for="hue">
        <span>Matiz primário <output id="degrees" for="hue">264°</output></span>
        <input id="hue" type="range" min="0" max="360" value="264">
      </label>
      <label class="equivalent-toggle">
        <input id="equivalents" type="checkbox">
        Mostrar equivalentes
      </label>
      <button id="theme" type="button" aria-pressed="false">Modo escuro</button>
    </div>
  </header>
  <main id="gallery"></main>

  <script>
    // Preset metadata is embedded so the gallery also works from a file URL.
    const presets = JSON.parse(document.querySelector("#background-presets").textContent);
    const categories = { gradients: "Gradientes", geometric: "Geométricos", decorative: "Decorativos", effects: "Efeitos" };
    const gallery = document.querySelector("#gallery");
    const root = document.documentElement;
    const button = document.querySelector("#theme");
    const slider = document.querySelector("#hue");
    const degrees = document.querySelector("#degrees");
    const equivalentToggle = document.querySelector("#equivalents");
    const bySlug = new Map(presets.map((preset) => [preset.slug, preset]));
    const equivalentCards = [];

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    for (const [category, name] of Object.entries(categories)) {
      const section = element("section");
      const heading = element("h2", name);
      heading.id = category;
      section.setAttribute("aria-labelledby", category);
      const grid = element("div", "", "grid");
      for (const preset of presets.filter((entry) => entry.category === category)) {
        const card = element("figure");
        if (preset.variantOf) equivalentCards.push(card);
        const preview = element("div", "", "preview");
        const layer = element("div");
        layer.dataset.dfBg = preset.slug;
        preview.setAttribute("aria-hidden", "true");
        preview.append(layer);
        const caption = element("figcaption");
        caption.append(element("strong", preset.name), element("code", preset.slug));
        if (preset.variants?.length) {
          const names = preset.variants.map((slug) => bySlug.get(slug).name);
          caption.append(element("p", `Equivalentes: ${names.join(", ")}`, "equivalent-names"));
        } else if (preset.variantOf) {
          caption.append(element("p", `Equivalente a ${bySlug.get(preset.variantOf).name}`, "equivalent-names"));
        }
        card.append(preview, caption);
        grid.append(card);
      }
      section.append(heading, grid);
      gallery.append(section);
    }

    function updateEquivalents() {
      for (const card of equivalentCards) card.hidden = !equivalentToggle.checked;
    }
    updateEquivalents();
    equivalentToggle.addEventListener("change", updateEquivalents);

    function updateHue() {
      const hue = slider.valueAsNumber;
      const dark = root.dataset.theme === "dark";
      root.style.setProperty("--primary", dark ? `oklch(0.72 0.17 ${hue})` : `oklch(0.56 0.20 ${hue})`);
      root.style.setProperty("--accent", dark ? `oklch(0.77 0.17 ${hue + 110})` : `oklch(0.69 0.18 ${hue + 110})`);
      degrees.value = `${hue}°`;
    }

    button.addEventListener("click", () => {
      const dark = root.dataset.theme !== "dark";
      root.dataset.theme = dark ? "dark" : "light";
      button.setAttribute("aria-pressed", String(dark));
      updateHue();
    });
    slider.addEventListener("input", updateHue);
  </script>
