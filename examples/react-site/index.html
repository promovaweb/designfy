<!doctype html>
<!-- Theme is resolved before the app and stylesheet load. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldnote · React component example</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem("designfy-theme"); } catch {}
        document.documentElement.classList.toggle("dark", theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
