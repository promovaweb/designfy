<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guia visual do Designfy</title>
    <link rel="icon" href="./logo/icon-32w.png" sizes="32x32">
    <link rel="stylesheet" href="./global.css">
    <style>
      body { margin: 0; background: var(--color-background); color: var(--color-text); font-family: var(--font-body); }
      main { margin: auto; max-width: 72rem; padding: 4rem 1.5rem; }
      h1, h2 { font-family: var(--font-heading); }
      h1 { font-size: 2.5rem; line-height: 1.2; font-weight: 750; }
      h2 { font-size: 2rem; line-height: 1.25; }
      p { line-height: 1.625; }
      .hero { align-items: center; display: grid; gap: 3rem; grid-template-columns: 1fr 1fr; min-height: 60vh; }
      .hero img { display: block; max-width: 100%; height: auto; }
      .swatches { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(10rem, 100%), 1fr)); }
      .swatch { border: 1px solid var(--color-border); border-radius: 1rem; overflow: hidden; }
      .sample { height: 8rem; }
      .swatch p { margin: 0; padding: 1rem; }
      @media (max-width: 48rem) {
        .hero { grid-template-columns: 1fr; min-height: 0; }
        h1 { font-size: 2.25rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div>
          <img src="./logo/icon.svg" width="96" height="96" alt="">
          <h1>Designfy</h1>
          <p>O quadro representa a interface. O bloco âmbar representa o componente. O rastro mostra seu movimento.</p>
        </div>
        <picture>
          <source srcset="./logo/logo-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="./logo/logo-light.svg" width="1227" height="320" alt="Assinatura horizontal do Designfy">
        </picture>
      </section>
      <h2>Paleta essencial</h2>
      <section class="swatches" aria-label="Cores da marca">
        <article class="swatch"><div class="sample" style="background:var(--color-primary-950)"></div><p>Petróleo · #00161E</p></article>
        <article class="swatch"><div class="sample" style="background:#C6F4ED"></div><p>Menta · #C6F4ED</p></article>
        <article class="swatch"><div class="sample" style="background:var(--color-primary-500)"></div><p>Turquesa · #2AD5BE</p></article>
        <article class="swatch"><div class="sample" style="background:var(--color-accent-500)"></div><p>Âmbar · #FFB224</p></article>
        <article class="swatch"><div class="sample" style="background:var(--color-accent-700)"></div><p>Âmbar escuro · #996300</p></article>
        <article class="swatch"><div class="sample" style="background:var(--color-neutral-50)"></div><p>Neutro claro · #F2F8F9</p></article>
      </section>
    </main>
  </body>
</html>
